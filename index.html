<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f4f1ea"/>
<title>Quiet Todo — a calm task list</title>
<meta name="description" content="A small, calm todo app. Add tasks, set due dates and priorities, filter, search and get things done. No accounts, no rewards, nothing leaves your browser."/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a33'/%3E%3Cpath d='M17 33l9 9 21-22' fill='none' stroke='%23f4f1ea' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">✓</span>
      <div>
        <h1>Quiet Todo</h1>
        <p class="date" id="today-label"></p>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" class="ghost" id="theme-toggle" aria-label="Switch to dark theme" title="Theme">◐</button>
    </div>
  </header>

  <section class="compose" aria-label="Add a task">
    <form id="add-form" autocomplete="off">
      <label class="sr-only" for="task-title">Task title</label>
      <input id="task-title" name="title" type="text" maxlength="200" placeholder="What needs doing?" required/>
      <div class="compose-row">
        <label class="field"><span>Due</span><input id="task-due" name="due" type="date"/></label>
        <label class="field"><span>Priority</span>
          <select id="task-priority" name="priority">
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label class="field grow"><span>Note</span><input id="task-note" name="note" type="text" maxlength="300" placeholder="Optional"/></label>
        <button type="submit" class="primary" id="add-button">Add task</button>
      </div>
    </form>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <section class="toolbar" aria-label="Filters">
    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" class="chip" data-filter="all" aria-pressed="true">All <span class="count" id="count-all">0</span></button>
      <button type="button" class="chip" data-filter="open" aria-pressed="false">Open <span class="count" id="count-open">0</span></button>
      <button type="button" class="chip" data-filter="today" aria-pressed="false">Today <span class="count" id="count-today">0</span></button>
      <button type="button" class="chip" data-filter="done" aria-pressed="false">Done <span class="count" id="count-done">0</span></button>
    </div>
    <label class="search">
      <span class="sr-only">Search tasks</span>
      <input id="search" type="search" placeholder="Search" autocomplete="off"/>
    </label>
  </section>

  <section class="list-area">
    <div id="list" class="list" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>
      <p class="empty-mark" aria-hidden="true">✓</p>
      <p id="empty-title">All clear.</p>
      <p id="empty-detail">Add a task above and it will show up here.</p>
    </div>
  </section>

  <footer class="foot">
    <span>Everything stays in this browser. No accounts, no tracking.</span>
    <button type="button" class="ghost small" id="clear-done">Clear completed</button>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
